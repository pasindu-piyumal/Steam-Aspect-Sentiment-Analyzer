<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Steam Sentiment Analyzer</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>

<body>

    <div class="container">

        <h1>
            🎮 Aspect-Based
            Sentiment Analyzer
        </h1>

        <p class="description">
            Enter a Steam game review below to analyze its
            sentiment and identify the aspects discussed,
            such as graphics, gameplay, story, performance,
            and sound.
        </p>

        <form
            action="/analyze"
            method="POST"
        >

            <textarea
                name="review"
                placeholder="Enter a Steam review..."
                required
            ></textarea>

            <button type="submit">
                Analyze Review
            </button>

        </form>

    </div>

</body>

</html>
